# Runs your project's tests on every push and pull request. The course site reads the newest finished run of THIS file on
# your default branch when you press Check, and shows it as "learner-run CI". Keep the file name.
#
# Needs no secret. The token may only read the repository, and the checkout does not keep it.
# Actions are pinned to full commits (checked against the official repositories on 24 November 2026):
#   actions/checkout v7.0.1      https://github.com/actions/checkout/releases/tag/v7.0.1
#   actions/setup-python v7.1.0  https://github.com/actions/setup-python/releases/tag/v7.1.0
name: course-check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: course-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # How your tests run. For the C project: bash tests/run_tests.sh all
  TEST_COMMAND: python -m pytest
  # Held-back checks: tests that are not in the zip. They are public, not secret. Both stay empty until the course
  # publishes them; then set owner/repo and the full 40-character commit, and they are pulled at run time.
  HELD_BACK_REPO: ""
  HELD_BACK_COMMIT: ""

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest

      - name: Your tests
        run: bash -c "$TEST_COMMAND"

      # A wrong or half-set pair fails the job: "not checked" must never look green.
      - name: Held-back checks, settings
        if: env.HELD_BACK_REPO != '' || env.HELD_BACK_COMMIT != ''
        run: |
          [[ "$HELD_BACK_REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "HELD_BACK_REPO must be owner/repo"; exit 1; }
          [[ "$HELD_BACK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "HELD_BACK_COMMIT must be a full 40-character commit"; exit 1; }

      - name: Held-back checks, download
        if: env.HELD_BACK_REPO != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HELD_BACK_REPO }}
          ref: ${{ env.HELD_BACK_COMMIT }}
          path: .held-back
          persist-credentials: false

      - name: Held-back checks, run
        if: env.HELD_BACK_REPO != ''
        run: python -I .held-back/run_held_back.py .
